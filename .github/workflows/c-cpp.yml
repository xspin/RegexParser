name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get install -y flex bison libfl-dev libgtest-dev
        cd /usr/src/googletest
        sudo cmake .
        sudo make
        sudo make install
        sudo cp -v /usr/local/lib/libgtest* /usr/lib/

    - name: Build
      run: make

    - name: Test
      run: make test
          
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ failure() }}

